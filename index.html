<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>A Special Surprise For You ❤️</title>

<style>

/* ==============================
   GENERAL
================================ */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    min-height: 100vh;
    background: #000;
}


/* ==============================
   PASSWORD PAGE
================================ */

#passwordPage {
    min-height: 100vh;
    background: #a90000;

    display: flex;
    justify-content: center;
    align-items: center;

    color: white;
}

.password-container {
    width: 90%;
    max-width: 850px;

    display: flex;
    justify-content: center;
    align-items: center;

    gap: 70px;
    flex-wrap: wrap;
}


/* FIRST PHOTO */

.photo-frame {
    position: relative;
}

.first-photo {
    width: 330px;
    height: 330px;

    object-fit: cover;

    border: 12px solid white;
}


/* BOW */

.bow {
    position: absolute;
    top: -50px;
    right: -40px;

    font-size: 80px;
}


/* PASSWORD */

.keypad-area {
    text-align: center;
}

.keypad-area h2 {
    font-size: 24px;
    margin-bottom: 15px;
}


/* PASSWORD BOXES */

.password-boxes {
    display: flex;
    justify-content: center;

    gap: 8px;

    margin-bottom: 20px;
}

.pass-box {
    width: 50px;
    height: 55px;

    border: 4px solid white;
    border-radius: 8px;

    display: flex;
    justify-content: center;
    align-items: center;

    font-size: 30px;
    font-weight: bold;
}


/* KEYPAD */

.keypad {
    display: grid;

    grid-template-columns: repeat(3, 65px);

    gap: 12px;

    justify-content: center;
}

.key {
    width: 65px;
    height: 65px;

    border: none;
    border-radius: 50%;

    background: white;
    color: #a90000;

    font-size: 25px;
    font-weight: bold;

    cursor: pointer;

    transition: 0.2s;
}

.key:hover {
    transform: scale(1.08);
}

.key:active {
    transform: scale(0.92);
}


/* WRONG PASSWORD */

#error {
    display: none;

    margin-top: 15px;

    color: #ffd6d6;
}


/* ==============================
   MESSAGE PAGE
================================ */

#messagePage {
    display: none;

    min-height: 100vh;

    padding: 40px 20px;

    text-align: center;

    background: linear-gradient(
        135deg,
        #ffd6f6,
        #e6d5ff,
        #d7f0ff,
        #ffe0f0
    );

    background-size: 400% 400%;

    animation: backgroundChange 12s ease infinite;

    color: #35123d;
}


/* BACKGROUND COLOR CHANGING */

@keyframes backgroundChange {

    0% {
        background-position: 0% 50%;
    }

    25% {
        background-position: 50% 100%;
    }

    50% {
        background-position: 100% 50%;
    }

    75% {
        background-position: 50% 0%;
    }

    100% {
        background-position: 0% 50%;
    }

}


/* HEADING */

.title {
    font-size: 42px;

    margin-bottom: 35px;

    animation: titleColor 5s infinite alternate;
}


/* TITLE COLOR CHANGING */

@keyframes titleColor {

    0% {
        color: #d62878;
    }

    25% {
        color: #7b2cbf;
    }

    50% {
        color: #006d77;
    }

    75% {
        color: #e85d04;
    }

    100% {
        color: #c9184a;
    }

}


/* HEARTS */

.heart {
    position: fixed;

    font-size: 25px;

    animation: floatHeart 6s linear infinite;

    opacity: 0.7;
}

@keyframes floatHeart {

    0% {
        transform: translateY(100vh);
        opacity: 0;
    }

    20% {
        opacity: 1;
    }

    100% {
        transform: translateY(-100vh);
        opacity: 0;
    }

}


/* MESSAGE BOX */

.message-box {

    max-width: 900px;

    min-height: 300px;

    margin: auto;

    padding: 35px;

    background: rgba(255,255,255,0.75);

    border-radius: 25px;

    box-shadow: 0 10px 30px rgba(0,0,0,0.15);

    backdrop-filter: blur(10px);

    text-align: left;
}


/* TYPING MESSAGE */

#messageText {

    font-size: 20px;

    line-height: 1.8;

    white-space: pre-line;

}


/* CURSOR */

#cursor {

    display: inline-block;

    width: 3px;

    height: 23px;

    background: #7b2cbf;

    animation: blink 0.7s infinite;

}

@keyframes blink {

    50% {
        opacity: 0;
    }

}


/* SECOND PHOTO */

.second-photo {

    display: block;

    width: 300px;

    max-width: 90%;

    margin: 35px auto 0;

    border-radius: 20px;

    box-shadow: 0 10px 30px rgba(0,0,0,0.2);

}


/* MUSIC BUTTON */

.music-button {

    margin-top: 25px;

    padding: 12px 22px;

    border: none;

    border-radius: 25px;

    background: #7b2cbf;

    color: white;

    font-size: 15px;

    cursor: pointer;
}


/* MOBILE */

@media(max-width: 600px) {

    .first-photo {
        width: 240px;
        height: 240px;
    }

    .password-container {
        gap: 40px;
    }

    .title {
        font-size: 30px;
    }

    .message-box {
        padding: 22px;
    }

    #messageText {
        font-size: 17px;
    }

}

</style>
</head>


<body>


<!-- ==================================================
     PASSWORD PAGE
================================================== -->

<section id="passwordPage">

    <div class="password-container">


        <!-- ==========================================
             FIRST PHOTO
             CHANGE photo1.jpg TO YOUR FIRST PHOTO
        =========================================== -->

        <div class="photo-frame">

            <img
                src="photo1.jpg"
                class="first-photo"
                alt="Our Memory"
            >

            <div class="bow">
                🎀
            </div>

        </div>


        <!-- PASSWORD -->

        <div class="keypad-area">

            <h2>Entre a passcode</h2>


            <div class="password-boxes">

                <div class="pass-box" id="box1"></div>

                <div class="pass-box" id="box2"></div>

                <div class="pass-box" id="box3"></div>

                <div class="pass-box" id="box4"></div>

            </div>


            <div class="keypad">

                <button class="key" onclick="enterNumber('1')">1</button>
                <button class="key" onclick="enterNumber('2')">2</button>
                <button class="key" onclick="enterNumber('3')">3</button>

                <button class="key" onclick="enterNumber('4')">4</button>
                <button class="key" onclick="enterNumber('5')">5</button>
                <button class="key" onclick="enterNumber('6')">6</button>

                <button class="key" onclick="enterNumber('7')">7</button>
                <button class="key" onclick="enterNumber('8')">8</button>
                <button class="key" onclick="enterNumber('9')">9</button>

                <button class="key" onclick="clearPassword()">×</button>

                <button class="key" onclick="enterNumber('0')">0</button>

                <button class="key" onclick="checkPassword()">#</button>

            </div>


            <p id="error">
                Wrong password 💭
            </p>

        </div>

    </div>

</section>



<!-- ==================================================
     MESSAGE PAGE
================================================== -->

<section id="messagePage">


    <!-- TITLE -->

    <h1 class="title">
        ❤️ For My Babu ❤️
    </h1>


    <!-- MESSAGE -->

    <div class="message-box">

        <p id="messageText"></p>

        <span id="cursor"></span>


        <!-- ==========================================
             SECOND PHOTO
             CHANGE photo2.jpg TO YOUR OTHER PHOTO
        =========================================== -->

        <img
            src="photo2.jpg"
            class="second-photo"
            alt="Our Memory"
        >

    </div>


    <!-- MUSIC -->

    <audio id="backgroundMusic" loop>

        <!-- ==========================================
             PUT YOUR MUSIC FILE NAME HERE
        =========================================== -->

        <source src="music.mp3" type="audio/mpeg">

    </audio>


    <button
        class="music-button"
        onclick="toggleMusic()"
        id="musicButton"
    >
        🔊 Music
    </button>


</section>



<script>


/* ==================================================
   PASSWORD
================================================== */


/* THIS IS YOUR CORRECT PASSWORD */

const correctPassword = "1203";


let enteredPassword = "";


/* ENTER NUMBER */

function enterNumber(number) {

    if (enteredPassword.length < 4) {

        enteredPassword += number;

        updatePasswordBoxes();

    }

}


/* SHOW NUMBERS */

function updatePasswordBoxes() {

    for(let i = 1; i <= 4; i++) {

        document.getElementById("box" + i).innerText =
            enteredPassword[i - 1] || "";

    }

}


/* CLEAR */

function clearPassword() {

    enteredPassword = "";

    updatePasswordBoxes();

    document.getElementById("error").style.display = "none";

}


/* CHECK PASSWORD */

function checkPassword() {

    if(enteredPassword === correctPassword) {

        /* HIDE PASSWORD PAGE */

        document.getElementById("passwordPage").style.display = "none";


        /* SHOW MESSAGE PAGE */

        document.getElementById("messagePage").style.display = "block";


        /* START TYPING */

        typeMessage();


        /* START MUSIC */

        const music =
            document.getElementById("backgroundMusic");

        music.play().catch(function() {

            console.log("Music needs user interaction.");

        });

    }

    else {

        document.getElementById("error").style.display = "block";

    }

}



/* ==================================================
   YOUR MESSAGE
================================================== */


/*
   WRITE YOUR MESSAGE INSIDE THE BACKTICKS BELOW.

   You can write as much as you want.
*/

const message = `My dearest Babu ❤️

As I sit here thinking about all our memories together, I can't help but smile.

You're not just a friend, you're someone who has made so many moments of my life more special.

From our silly conversations to the moments we will never forget, every memory with you is precious to me.

I hope this little surprise makes you smile the way you have made me smile countless times.

Thank you for being you. ❤️

Happy Birthday, Babu! 🎂✨

Here's to many more memories together!`;



/* ==================================================
   TYPING EFFECT
================================================== */

let messageIndex = 0;


function typeMessage() {

    if(messageIndex < message.length) {

        document.getElementById("messageText").innerText +=
            message.charAt(messageIndex);

        messageIndex++;

        setTimeout(typeMessage, 45);

    }

}



/* ==================================================
   MUSIC
================================================== */

function toggleMusic() {

    const music =
        document.getElementById("backgroundMusic");

    const button =
        document.getElementById("musicButton");


    if(music.paused) {

        music.play();

        button.innerText = "🔊 Music ON";

    }

    else {

        music.pause();

        button.innerText = "🔇 Music OFF";

    }

}



/* ==================================================
   FLOATING HEARTS
================================================== */

function createHeart() {

    const heart = document.createElement("div");

    heart.className = "heart";

    heart.innerText = "❤️";

    heart.style.left =
        Math.random() * 100 + "vw";

    heart.style.animationDuration =
        (4 + Math.random() * 5) + "s";

    document.getElementById("messagePage")
        .appendChild(heart);


    setTimeout(() => {

        heart.remove();

    }, 9000);

}


setInterval(createHeart, 1200);


</script>

</body>
</html>
